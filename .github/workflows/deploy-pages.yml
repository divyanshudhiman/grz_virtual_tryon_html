name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build site
        run: npm run build
        env:
          VITE_BASE_PATH: /grz_virtual_tryon_html/
          VITE_VIDEO_BASE_URL: https://github.com/divyanshudhiman/grz_virtual_tryon_html/raw/main/public

      - name: Shrink deploy bundle (videos load from repo, not Pages artifact)
        run: rm -rf dist/videos

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy site from ${{ github.sha }}"
